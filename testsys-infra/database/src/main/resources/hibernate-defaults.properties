### --- Hibernate defaults --- ###

# PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Validate schema against entities on startup (Liquibase manages DDL)
spring.jpa.hibernate.ddl-auto=validate

# Batch inserts/updates for better performance
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Pad IN clause parameters to powers of 2 for better query plan caching
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Consistent UTC timezone for JDBC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Turn off Open Session in View
spring.jpa.open-in-view=false

# Enable Liquibase migrations
spring.liquibase.enabled=true

# Snowflake id generator: node id of this instance in 0..1023, must differ between instances of a cluster.
# Non-numeric, blank or out-of-range values fail startup. Override via application properties, a command-line
# argument or a JVM system property (-Dspring.jpa.properties.testsys.id.node-id=N); a plain environment variable
# SPRING_JPA_PROPERTIES_TESTSYS_ID_NODE_ID does NOT work because Spring Boot maps it to the key testsys.id.node.id.
spring.jpa.properties.testsys.id.node-id=0
