# The default daemon limits (512 MiB heap, 384 MiB metaspace) run out on the full build with KSP, Vaadin and Detekt.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Independent modules build and test at the same time; each test JVM starts its own containers.
org.gradle.parallel=true
