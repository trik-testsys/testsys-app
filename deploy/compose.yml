# Services shared by all TestSys environments. This file is not started alone: deploy/testsys.sh combines it with
# the override of one environment and its variable files in deploy/env/, for example:
#   sh deploy/testsys.sh dev up
# Compose interpolates every file before merging, so this file contains no required (:?) variables: each override
# checks the variables of its own environment.

services:
  app:
    build: ..
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Shared settings and the settings of the environment mounted by its override.
      SPRING_CONFIG_IMPORT: file:/etc/testsys/application.yml,file:/etc/testsys/application-environment.yml
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testsys
      SPRING_DATASOURCE_USERNAME: testsys
    # Published only on the loopback interface of the Docker host; production puts an HTTPS proxy in front of it.
    ports:
      - "127.0.0.1:${TESTSYS_HTTP_PORT:-8080}:8080"
    # Spring Boot opens the HTTP port after creating all singletons and running their SmartInitializingSingleton
    # callbacks, that is after Liquibase migrations and the Public Community and Supervisor bootstraps, so an accepted
    # TCP connection means the application is ready.
    healthcheck:
      test: ["CMD", "bash", "-c", ": </dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5m
      start_interval: 2s
    volumes:
      - files:/var/lib/testsys/files
      - type: bind
        source: ./config/application.yml
        target: /etc/testsys/application.yml
        read_only: true
        bind:
          create_host_path: false

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testsys
      POSTGRES_USER: testsys
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testsys -d testsys"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  files:
