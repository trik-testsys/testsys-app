<!-- @dsCard group="Components" viewport="700x380" name="Quiz" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../lib/dev-loader.js"></script>
<style>body{padding:20px;background:var(--surface-page)} .l{font:500 11px var(--font-mono);color:var(--text-tertiary);margin-bottom:8px;display:block} .r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style>
</head><body><div id="root"><div style="padding:40px;text-align:center;font:500 12px var(--font-mono);color:var(--text-tertiary)">Загрузка…</div></div>
<script type="text/babel">
window.__tsReady.then(NS => {
const { QuizOption, QuestionNav, CodeEditor } = NS;
function Demo() {
  const [sel, setSel] = React.useState(1); const [code, setCode] = React.useState('int main() {\n    int n; cin >> n;\n    cout << n * 2;\n}');
  return <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 14, alignItems: 'start' }}>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>{['O(n)', 'O(n log n)', 'O(n²)', 'O(log n)'].map((o, i) => <QuizOption key={i} letter={'ABCD'[i]} label={o} selected={sel === i} onClick={() => setSel(i)} />)}</div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}><QuizOption multiple letter="A" label="Куча" result="correct" /><QuizOption multiple letter="B" label="Хеш-таблица" selected result="wrong" /></div>
      <div style={{ borderRadius: 10, overflow: 'hidden' }}><CodeEditor value={code} onChange={setCode} minHeight={110} /></div>
    </div>
    <QuestionNav total={10} current={4} answered={[1, 2, 3]} flagged={[2, 8]} />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
