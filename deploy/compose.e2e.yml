# E2E environment over deploy/compose.yml for an external test process: application, PostgreSQL and Mailpit.
# Start it with deploy/testsys.sh, which reads deploy/env/e2e.env and deploy/env/e2e.local.env:
#   sh deploy/testsys.sh e2e up [--node]
# --node adds deploy/compose.grading-node.yml as the last file to run a grading node in this project.
# Runs alongside the dev environment: project name, volumes and published ports differ.
name: testsys-e2e

services:
  app:
    environment:
      SPRING_DATASOURCE_PASSWORD: testsys
      TESTSYS_MAIL_HOST: mailpit
      TESTSYS_MAIL_PORT: "1025"
      # grading-node:8080 with deploy/compose.grading-node.yml, addresses of other nodes, or empty for no nodes.
      TESTSYS_GRADING_NODES: ${TESTSYS_GRADING_NODES?set TESTSYS_GRADING_NODES to grading node addresses or to an empty value}
    volumes:
      - type: bind
        source: ./config/application-e2e.yml
        target: /etc/testsys/application-environment.yml
        read_only: true
        bind:
          create_host_path: false

  postgres:
    environment:
      POSTGRES_PASSWORD: testsys
    ports:
      - "127.0.0.1:${TESTSYS_DB_PORT:-5434}:5432"

  # Accepts all mail on the internal SMTP port 1025 without relaying it; messages are shown in the web UI.
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:${TESTSYS_MAIL_UI_PORT:-8026}:8025"
