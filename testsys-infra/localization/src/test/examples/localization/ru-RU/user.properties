user.deleted={:term name=user case=nom number=pl} удалены
user.solved=.input {$gender :string} \
    .input {$count :integer} \
    .match $gender \
    female {{{$name} решила {$count} {$count :term name=task case=acc}}} \
    male   {{{$name} решил {$count} {$count :term name=task case=acc}}} \
    *      {{{:term name=user case=nom number=sg} {$name} решил {$count} {$count :term name=task case=acc}}}
user.rating.delta=Изменение рейтинга: {$delta :integer signDisplay=always}
