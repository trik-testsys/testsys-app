<!-- @dsCard group="Components" viewport="700x380" name="Quiz" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../lib/dev-loader.js"></script>
<style>body{padding:20px;background:var(--surface-page)} .l{font:500 11px var(--font-mono);color:var(--text-tertiary);margin-bottom:8px;display:block} .r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style>
<link rel="icon" type="image/svg+xml" sizes="any" href="../../assets/brand/emblem/svg/TestSys-mono-emblem.svg?v=rounded-96">
</head><body><div id="root"><div style="padding:40px;text-align:center;font:500 12px var(--font-mono);color:var(--text-tertiary)">Загрузка…</div></div>
<script src="../../lib/catalog-nav.js"></script>
<script type="text/babel" src="../../lib/CatalogExamples.jsx"></script>
<script type="text/babel">
window.__tsReady.then(NS => {
const { QuizOption, QuestionNav, CodeEditor } = NS;
function Demo() {
  const [notice, setNotice] = React.useState('Исходные варианты');
  const [current, setCurrent] = React.useState(4); const [sel, setSel] = React.useState(1); const [code, setCode] = React.useState('script.forward(50);\nscript.wait(1000);\nscript.stop();');
  return <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 14, alignItems: 'start' }}>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>{['Датчик линии', 'Датчик расстояния', 'Мотор', 'Гироскоп'].map((o, i) => <QuizOption key={i} letter={'ABCD'[i]} label={o} selected={sel === i} onClick={() => setSel(i)} />)}</div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}><QuizOption multiple letter="A" label="Куча" result="correct" /><QuizOption multiple letter="B" label="Хеш-таблица" selected result="wrong" /></div>
      <div style={{ borderRadius: 10, overflow: 'hidden' }}><CodeEditor value={code} onChange={setCode} minHeight={110} /></div>
    </div>
    <QuestionNav total={10} current={current} onSelect={setCurrent} answered={[1, 2, 3]} flagged={[2, 8]} />
  </div>;
}
function Card() {
  const [version, setVersion] = React.useState(0);
  return <><NS.Button variant="secondary" size="sm" onClick={() => setVersion(version + 1)}>Сбросить всю карточку</NS.Button><><div onClick={e => { const target = e.target.closest('button, a'); if (target && !target.disabled) { const status = document.getElementById('card-action-status'); status.textContent = 'Действие: ' + (target.textContent.trim() || target.getAttribute('aria-label') || 'выбор'); } }}><Demo key={version} /><p id="card-action-status" role="status">Выберите действие в образцах</p></div><CatalogExamples key={'states-' + version} group="quiz" namespace={NS} /></></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
});
</script></body></html>
