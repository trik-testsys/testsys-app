<!-- @dsCard group="Components" viewport="700x150" name="Icons" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../lib/dev-loader.js"></script>
<style>body{padding:20px;background:var(--surface-page)} .l{font:500 11px var(--font-mono);color:var(--text-tertiary);margin-bottom:8px;display:block} .r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style>
<link rel="icon" type="image/svg+xml" sizes="any" href="../../assets/brand/emblem/svg/TestSys-emblem.svg">
</head><body><div id="root"><div style="padding:40px;text-align:center;font:500 12px var(--font-mono);color:var(--text-tertiary)">Загрузка…</div></div>
<script src="../../lib/catalog-nav.js"></script>
<script type="text/babel" src="../../lib/CatalogExamples.jsx"></script>
<script type="text/babel">
window.__tsReady.then(NS => {
const { Icon } = NS;
const names = ['search', 'chevron-down', 'chevron-up', 'chevron-left', 'chevron-right', 'bell', 'plus', 'minus', 'check', 'x', 'upload', 'download', 'clock', 'file', 'info', 'triangle-alert', 'circle-x', 'circle-check', 'ellipsis', 'list-filter', 'calendar', 'flag', 'grip-vertical', 'help-circle', 'refresh-cw', 'external-link', 'trash', 'pencil', 'user', 'users', 'trophy', 'code', 'lock', 'megaphone', 'snowflake', 'log-out', 'settings'];
function Demo() {
  return <div style={{ display: 'grid', gridTemplateColumns: 'repeat(8, 1fr)', gap: 12, color: 'var(--ink-900)' }}>
    {names.map(n => <div key={n} title={n} style={{ minHeight: 60, display: 'grid', placeItems: 'center', background: 'var(--white)', border: '1px solid var(--line)', borderRadius: 8 }}><Icon name={n} size={18} /><span className="ts-mono" style={{ fontSize: 11 }}>{n}</span></div>)}
  </div>;
}
function Card() {
  const [version, setVersion] = React.useState(0);
  return <><NS.Button variant="secondary" size="sm" onClick={() => setVersion(version + 1)}>Сбросить всю карточку</NS.Button><><Demo key={version} /><CatalogExamples key={'states-' + version} group="core" namespace={NS} /></></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
});
</script></body></html>
