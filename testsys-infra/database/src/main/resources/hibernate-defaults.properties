### --- Hibernate defaults --- ###

# MySQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Validate schema against entities on startup (Liquibase manages DDL)
spring.jpa.hibernate.ddl-auto=validate

# Batch inserts/updates for better performance
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Pad IN clause parameters to powers of 2 for better query plan caching
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Consistent UTC timezone for JDBC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Turn off Open Session in View
spring.jpa.open-in-view=false

# Enable Liquibase migrations
spring.liquibase.enabled=true
