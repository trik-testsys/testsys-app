# Development environment over deploy/compose.yml and deploy/compose.monitoring.yml: application, PostgreSQL,
# Prometheus, Grafana, Mailpit and the optional seed script.
# Start it with deploy/testsys.sh, which reads deploy/env/dev.env and deploy/env/dev.local.env:
#   sh deploy/testsys.sh dev up [--node]
# --node adds deploy/compose.grading-node.yml as the last file to run a grading node in this project.
# Runs alongside the e2e environment: project name, volumes and published ports differ.
name: testsys-dev

services:
  app:
    environment:
      SPRING_DATASOURCE_PASSWORD: testsys
      # Fixed and not secret, like the database password: the sign-in code of the service interface in dev and e2e.
      TESTSYS_SERVICE_SECRET: local-service-secret-for-dev-and-e2e-environments-only-not-secret
      TESTSYS_SERVICE_GRAFANAURL: ${TESTSYS_GRAFANA_URL:?set TESTSYS_GRAFANA_URL to the Grafana address}
      TESTSYS_MAIL_HOST: mailpit
      TESTSYS_MAIL_PORT: "1025"
      # grading-node:8080 with deploy/compose.grading-node.yml, addresses of other nodes, or empty for no nodes.
      TESTSYS_GRADING_NODES: ${TESTSYS_GRADING_NODES?set TESTSYS_GRADING_NODES to grading node addresses or to an empty value}
      # The grading node registry is stored in the database; every start adds these addresses to it as enabled.
      TESTSYS_GRADING_IMPORT_NODES: "true"
    volumes:
      - type: bind
        source: ./config/application-dev.yml
        target: /etc/testsys/application-environment.yml
        read_only: true
        bind:
          create_host_path: false
      # Application log files; deploy/testsys.sh creates the directory before starting.
      - type: bind
        source: ./logs/dev
        target: /var/log/testsys
        bind:
          create_host_path: false

  postgres:
    environment:
      POSTGRES_PASSWORD: testsys
    ports:
      - "127.0.0.1:${TESTSYS_DB_PORT:-5433}:5432"

  grafana:
    environment:
      # The address of this Grafana, also opened from the service cabinet; its port is TESTSYS_GRAFANA_PORT.
      GF_SERVER_ROOT_URL: ${TESTSYS_GRAFANA_URL:?set TESTSYS_GRAFANA_URL to the Grafana address}

  # Accepts all mail on the internal SMTP port 1025 without relaying it; messages are shown in the web UI.
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:${TESTSYS_MAIL_UI_PORT:-8025}:8025"

  # Applies the SQL script from TESTSYS_DB_SEED_SCRIPT once per database, after the application is ready and
  # therefore after the Liquibase migrations; see deploy/db-seed/entrypoint.sh. Exits after every start.
  db-seed:
    image: postgres:17-alpine
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/testsys/db-seed-entrypoint.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: testsys
      PGUSER: testsys
      PGPASSWORD: testsys
    # Replaces the anonymous volume that the image declares for server data; the service runs only psql.
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      # Without the variable /dev/null is mounted and the script reports that there is nothing to apply.
      # A relative path is resolved from deploy/.
      - type: bind
        source: ${TESTSYS_DB_SEED_SCRIPT:-/dev/null}
        target: /opt/testsys/db-seed.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./db-seed/entrypoint.sh
        target: /opt/testsys/db-seed-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
