task.result=Вы решили {$count :integer} {$count :term name=task case=acc}
task.progress=.input {$count :integer} \
    .match $count \
    0    {{Вы ещё не решили ни одной {:term name=task case=gen number=sg}}} \
    one  {{Решена {$count} {$count :term name=task case=nom}}} \
    few  {{Решены {$count} {$count :term name=task case=nom}}} \
    many {{Решено {$count} {$count :term name=task case=nom}}} \
    *    {{Решено {$count} {$count :term name=task case=nom}}}
task.created={:term name=task case=nom number=sg} создана
task.list.title=Список {:term name=task case=gen number=pl}
task.count.words={$count :spellout rules=spellout-cardinal-feminine} {$count :term name=task case=nom}
task.deadline.in_days=.input {$days :integer} \
    .match $days \
    one  {{через {$days} день}} \
    few  {{через {$days} дня}} \
    many {{через {$days} дней}} \
    *    {{через {$days} дней}}
task.deadline.passed=Дедлайн прошёл
task.score.percent=Результат: {$value :percent}
task.score.share=.input {$share :percent} \
    .match $share \
    one   {{Набран {$share} от максимума}} \
    few   {{Набрано {$share} от максимума}} \
    many  {{Набрано {$share} от максимума}} \
    other {{Набрано {$share} от максимума}} \
    *     {{Набрано {$share} от максимума}}
task.score.points=.input {$points :number} \
    .match $points \
    one   {{{$points} балл}} \
    few   {{{$points} балла}} \
    many  {{{$points} баллов}} \
    other {{{$points} балла}} \
    *     {{{$points} балла}}
task.score.average=Средний балл: {$average :number maximumFractionDigits=$precision}
task.solutions.total=Всего решений: {$total :number notation=compact}
