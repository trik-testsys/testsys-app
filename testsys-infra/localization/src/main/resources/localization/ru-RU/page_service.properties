page_service.settings.help.max_participants=Максимальное общее количество {:term name=participant case=gen number=pl} \
    в одном {:term name=competition case=loc number=sg}.\n\nНеотрицательное целое число типа Kotlin Int.\n\nИзменения \
    вступят в силу при последующих добавлениях {:term name=participant case=gen number=pl}; существующие \
    {:term name=participant case=nom number=pl} останутся в {:term name=competition case=loc number=sg}.
page_service.settings.help.confirmation_code_lifetime=Время, в течение которого можно подтвердить почту выданным \
    кодом.\n\nПоложительная длительность ISO-8601, например PT5M.\n\nИзменения вступят в силу при создании или \
    перезаписи запроса подтверждения почты.
page_service.settings.help.max_confirmation_attempts=Количество попыток ввода кода подтверждения \
    почты.\n\nПоложительное целое число типа Kotlin Int.\n\nИзменения вступят в силу при создании или \
    перезаписи запроса подтверждения почты.
page_service.settings.help.community_invite_ttl=Срок действия {:term name=invite_code case=gen number=sg} в \
    {:term name=community case=acc number=sg}.\n\nПоложительная длительность ISO-8601, например PT5M.\n\nИзменения \
    вступят в силу при создании, замене или продлении {:term name=invite_code case=gen number=sg}.
page_service.settings.help.class_invite_ttl=Срок действия {:term name=invite_code case=gen number=sg} в \
    {:term name=class case=acc number=sg}.\n\nПоложительная длительность ISO-8601, например PT5M.\n\nИзменения \
    вступят в силу при создании, замене или продлении {:term name=invite_code case=gen number=sg}.
page_service.settings.help.grading_max_attempts=Общее число транспортных попыток запуска проверки на Проверяющем \
    узле.\n\nПоложительное целое число типа Kotlin Int.\n\nИзменения вступят в силу при приёме новой проверки. Уже \
    принятые проверки сохранят прежние настройки до завершения.
page_service.settings.help.total_timeout=Общее время на подготовку, ожидание Проверяющего узла и выполнение \
    проверки.\n\nПоложительная длительность ISO-8601, например PT5M.\n\nИзменения вступят в силу при приёме новой \
    проверки. Уже принятые проверки сохранят прежние настройки до завершения.
page_service.settings.help.rpc_timeout=Срок одного запроса проверки к узлу; ограничен оставшимся общим временем \
    проверки.\n\nПоложительная длительность ISO-8601, например PT5M.\n\nИзменения вступят в силу при приёме новой \
    проверки. Уже принятые проверки сохранят прежние настройки до завершения.
page_service.settings.help.should_record_video=Запрашивать у Проверяющего узла видеозапись проверки.\n\ntrue — \
    включена, false — выключена.\n\nИзменения вступят в силу при приёме новой проверки. Уже принятые проверки \
    сохранят прежние настройки до завершения.
page_service.settings.help.poll_interval=Промежуток между фоновыми опросами состояния Проверяющих \
    узлов.\n\nПоложительная длительность ISO-8601, например PT5M.\n\nИзменения вступят в силу после сохранения: расписание \
    опроса будет перестроено с новым интервалом.
page_service.settings.help.status_timeout=Максимальное время ожидания ответа о состоянии Проверяющего \
    узла.\n\nПоложительная длительность ISO-8601, например PT5M.\n\nИзменения вступят в силу при следующем запросе статуса \
    узла.
page_service.settings.help.max_message_bytes=.input {$active :integer useGrouping=never} \
    .match $active \
    one  {{Максимальный размер входящего gRPC-сообщения от Проверяющего узла.\n\nПоложительное целое число типа Kotlin Int, в байтах.\n\nИзменения вступят в силу после перезапуска приложения. Поле показывает сохранённое значение. Действующий предел — {$active} байт.}} \
    few  {{Максимальный размер входящего gRPC-сообщения от Проверяющего узла.\n\nПоложительное целое число типа Kotlin Int, в байтах.\n\nИзменения вступят в силу после перезапуска приложения. Поле показывает сохранённое значение. Действующий предел — {$active} байта.}} \
    many {{Максимальный размер входящего gRPC-сообщения от Проверяющего узла.\n\nПоложительное целое число типа Kotlin Int, в байтах.\n\nИзменения вступят в силу после перезапуска приложения. Поле показывает сохранённое значение. Действующий предел — {$active} байт.}} \
    *    {{Максимальный размер входящего gRPC-сообщения от Проверяющего узла.\n\nПоложительное целое число типа Kotlin Int, в байтах.\n\nИзменения вступят в силу после перезапуска приложения. Поле показывает сохранённое значение. Действующий предел — {$active} байт.}}
page_service.settings.help.max_time_limit_millis=Верхняя граница ограничения времени в \
    {:term name=polygon case=loc number=sg}, которую проверяет \
    {:term name=diagnostic case=nom number=sg}.\n\nНеотрицательное целое число типа Kotlin Long, в миллисекундах.\n\nИзменения вступят в силу при следующей \
    {:term name=diagnostic case=loc number=sg}.
page_service.settings.help.score_prefix=Текст, по которому {:term name=diagnostic case=nom number=sg} распознаёт \
    вывод баллов в {:term name=polygon case=loc number=sg}. Регистр учитывается.\n\nТекст не должен быть пустым или \
    состоять только из пробелов; пробелы сохраняются.\n\nИзменения вступят в силу при следующей \
    {:term name=diagnostic case=loc number=sg}.
page_service.settings.help.cleanup_minimum_age=Минимальное время после изменения файла без записи в БД, \
    позволяющее удалить его при очистке.\n\nПоложительная длительность ISO-8601, например PT5M.\n\nИзменения \
    вступят в силу при следующем явном проходе очистки. Сохранение настройки не запускает очистку.
page_service.settings.help.cleanup_batch_size=Максимальное количество записей или файлов в одном пакете \
    очистки.\n\nПоложительное целое число типа Kotlin Int.\n\nИзменения вступят в силу при следующем явном проходе \
    очистки. Сохранение настройки не запускает очистку.
