# Local Prometheus and Grafana for a TestSys process started on the same machine; see README.md.
name: testsys-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --enable-feature=created-timestamp-zero-ingestion
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Lets the container reach the TestSys metrics server on the host, also on Linux.
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    depends_on:
      - prometheus
    environment:
      # The administrator keeps the Grafana default password until it is changed at the first sign-in.
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}/
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
