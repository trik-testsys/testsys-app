  <title id="logo-title">TestSys — horizontal large type 01, v8</title>
  <desc id="logo-description">Horizontal lockup, revision 8. Wordmark body height is 65% of the 184-unit emblem height (119.6 units), reduced uniformly from 85% in revision 7. Original DejaVu Sans Mono Bold outlines, emblem geometry, and colors are preserved. The emblem and the main letter body share an optical center; the y descender is excluded from alignment but included in visible-bounds checks. Canvas resized to give exactly 48 vector units of padding on all four sides of the foreground composition, including a rounded-square badge where present. Full-bleed color panels are backgrounds and excluded from foreground padding. No glyph distortion. Vector artwork only.</desc>
