contest.number={$number :ordinal rules=digits-ordinal-masculine} тур
contest.start=Тур начнётся {$start :datetime}
contest.start.moscow=Начало тура: {$start :datetime dateFields=year-month-day dateLength=long timePrecision=minute timeZone=|Europe/Moscow| timeZoneStyle=short}
contest.start.local=Начало тура по местному времени: {$start :datetime timeZone=$zone}
contest.start.venue=Начало тура по времени площадки: {$start :datetime timeZone=input}
contest.deadline=Приём решений до {$deadline :date fields=year-month-day length=long}
contest.day=День тура: {$day :date fields=month-day length=long}
contest.date=Дата тура: {$date :date}
contest.start.utc=Начало тура по UTC: {$start :time precision=minute hour12=false timeZone=UTC}
contest.venue.distance=До площадки: {$distance :unit unit=meter usage=road}
contest.attempts=.input {$left :integer select=exact} \
    .match $left \
    1 {{Осталась последняя попытка}} \
    * {{Осталось попыток: {$left}}}
contest.countdown=.input {$phase :string} \
    .input {$days :integer} \
    .match $phase $days \
    start one  {{До начала тура остался {$days} день}} \
    start few  {{До начала тура осталось {$days} дня}} \
    start many {{До начала тура осталось {$days} дней}} \
    end   one  {{До конца тура остался {$days} день}} \
    end   few  {{До конца тура осталось {$days} дня}} \
    end   many {{До конца тура осталось {$days} дней}} \
    *     one  {{Остался {$days} день}} \
    *     few  {{Осталось {$days} дня}} \
    *     many {{Осталось {$days} дней}} \
    *     *    {{Осталось {$days} дней}}
