user.registration.confirmation_code.subject=Код подтверждения для регистрации в TestSys
user.registration.confirmation_code.body=Здравствуйте!\n\nВы начали регистрацию в TestSys. Чтобы подтвердить адрес \
    электронной почты, введите этот код на странице регистрации:\n\n{$confirmationCode}\n\nКод действует ограниченное \
    время. Если код больше не действует, начните регистрацию заново, и Вам придёт новый код.\n\nЕсли Вам пришло \
    несколько таких писем, введите код из последнего.\n\nЕсли Вы не начинали регистрацию в TestSys, \
    ничего делать не нужно. Просто удалите это письмо.
user.registration.access_code.subject=Ваш {:term name=access_code case=nom number=sg} к TestSys
user.registration.access_code.body=Здравствуйте, {$name}!\n\nРегистрация в TestSys завершена. \
    Ваш {:term name=access_code case=nom number=sg}:\n\n{$accessCode}\n\nЧтобы войти в TestSys, введите этот код \
    на странице входа. Больше ничего вводить не нужно.\n\nВводите код точно так, как он написан здесь, вместе \
    с дефисами. Большие и маленькие буквы различаются.\n\nСохраните это письмо или запишите код. Никому его \
    не сообщайте: тот, кто знает код, может войти в TestSys под Вашим именем.
user.email_change.confirmation_code.subject=Код подтверждения для смены адреса электронной почты в TestSys
user.email_change.confirmation_code.body=Здравствуйте!\n\nВы запросили смену адреса электронной почты в TestSys \
    на этот адрес. Чтобы подтвердить новый адрес, введите в TestSys этот код:\n\n{$confirmationCode}\n\nКод действует \
    ограниченное время. Если код больше не действует, запросите смену адреса заново, и Вам придёт новый код.\n\nЕсли \
    Вам пришло несколько таких писем, введите код из последнего.\n\nЕсли Вы не запрашивали смену адреса электронной \
    почты в TestSys, ничего делать не нужно. Просто удалите это письмо.
user.email_change.notice.subject=Адрес электронной почты в TestSys изменён
user.email_change.notice.body=Здравствуйте, {$name}!\n\nВаш адрес электронной почты в TestSys изменён. Письма \
    от TestSys теперь будут приходить на новый адрес, а не на этот.\n\nИзменить адрес может только тот, кто знает \
    Ваш {:term name=access_code case=acc number=sg}.
