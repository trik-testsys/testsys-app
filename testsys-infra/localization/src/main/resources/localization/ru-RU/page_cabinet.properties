page_cabinet.home=Главная
page_cabinet.menu=Меню
page_cabinet.profile=Профиль
page_cabinet.sign_out=Выйти
page_cabinet.role_name=.input {$role :string} \
    .match $role \
    administrator {{Администратор}} \
    developer     {{Разработчик}} \
    manager       {{Организатор}} \
    judge         {{Судья}} \
    student       {{Ученик}} \
    participant   {{Участник}} \
    observer      {{Наблюдатель}} \
    supervisor    {{Супервайзер}} \
    *             {{Роль}}
page_cabinet.section.contests=Туры
page_cabinet.section.users=Пользователи
page_cabinet.section.communities=Сообщества
page_cabinet.section.tasks=Задачи
page_cabinet.section.classes=Классы
page_cabinet.section.competitions=Соревнования
page_cabinet.section.submissions=Посылки
page_cabinet.name_too_long=.input {$max :integer} \
    .match $max \
    one  {{Не длиннее {$max} символа}} \
    few  {{Не длиннее {$max} символов}} \
    many {{Не длиннее {$max} символов}} \
    *    {{Не длиннее {$max} символов}}
page_cabinet.validation_status=.input {$status :string} \
    .match $status \
    not_started {{Не запускалась}} \
    running     {{Идёт}} \
    success     {{Успех}} \
    failure     {{Неуспех}} \
    stopped     {{Техническая остановка}} \
    *           {{Неизвестный статус}}
page_cabinet.duration.unlimited=Без ограничения
page_cabinet.duration.hours={$hours :number useGrouping=never} ч
page_cabinet.duration.minutes={$minutes :integer} мин
page_cabinet.duration.hours_minutes={$hours :number useGrouping=never} ч {$minutes :integer} мин
