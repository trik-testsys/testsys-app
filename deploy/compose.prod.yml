# Production environment over deploy/compose.yml and deploy/compose.monitoring.yml: application, PostgreSQL,
# Prometheus, Grafana, Loki and Grafana Alloy with persistent volumes, external SMTP.
# Start it with deploy/testsys.sh and the production variable file kept outside the Git checkout
# (template: deploy/env/prod.env.example):
#   sh deploy/testsys.sh prod up [--node] --env-file <path>
# All ports are published only on 127.0.0.1. The main interface is meant for an external HTTPS proxy.
# The service interface, Grafana and Prometheus are reached directly, for example through an SSH tunnel; do not put
# them behind the HTTPS proxy. Prometheus of this project reads the metrics server inside the project network.
# Grading nodes are managed in the service cabinet. TESTSYS_GRADING_NODES lists addresses for import there, or for
# every start with TESTSYS_GRADING_IMPORT_NODES=true. --node adds deploy/compose.grading-node.yml as the last file
# to run a node on the same server at grading-node:8080.
name: testsys-prod

services:
  app:
    image: ${TESTSYS_APP_IMAGE:-testsys-app:latest}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_PASSWORD: ${TESTSYS_DB_PASSWORD:?set TESTSYS_DB_PASSWORD}
      TESTSYS_MAIL_PASSWORD: ${TESTSYS_MAIL_PASSWORD:?set TESTSYS_MAIL_PASSWORD}
      TESTSYS_OPERATION_SUPERVISOR_ACCESS_TOKEN: ${TESTSYS_SUPERVISOR_ACCESS_TOKEN:?set TESTSYS_SUPERVISOR_ACCESS_TOKEN}
      TESTSYS_SERVICE_SECRET: ${TESTSYS_SERVICE_SECRET:?set TESTSYS_SERVICE_SECRET}
      TESTSYS_SERVICE_GRAFANAURL: ${TESTSYS_GRAFANA_URL:?set TESTSYS_GRAFANA_URL}
      TESTSYS_GRADING_NODES: ${TESTSYS_GRADING_NODES:-}
      TESTSYS_GRADING_IMPORT_NODES: ${TESTSYS_GRADING_IMPORT_NODES:-false}
      # Applies only to the main interface: the service and metrics contexts reset it to none.
      SERVER_FORWARDHEADERSSTRATEGY: native
    volumes:
      # Server copy of deploy/config/application-prod.example.yml, kept outside the Git checkout.
      - type: bind
        source: ${TESTSYS_APP_CONFIG:?set TESTSYS_APP_CONFIG to the absolute path of the application configuration file}
        target: /etc/testsys/application-environment.yml
        read_only: true
        bind:
          create_host_path: false
      # Application log files in an existing directory outside the Git checkout, writable by the user 10001.
      - type: bind
        source: ${TESTSYS_LOG_DIR:?set TESTSYS_LOG_DIR to the absolute path of the application log directory}
        target: /var/log/testsys
        bind:
          create_host_path: false

  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${TESTSYS_DB_PASSWORD:?set TESTSYS_DB_PASSWORD}

  prometheus:
    restart: unless-stopped

  loki:
    restart: unless-stopped

  alloy:
    restart: unless-stopped

  grafana:
    restart: unless-stopped
    environment:
      # The address of this Grafana through the SSH tunnel, also opened from the service cabinet.
      GF_SERVER_ROOT_URL: ${TESTSYS_GRAFANA_URL:?set TESTSYS_GRAFANA_URL}
      # Grafana applies it only when it creates its database in an empty volume; later change it in Grafana.
      GF_SECURITY_ADMIN_PASSWORD: ${TESTSYS_GRAFANA_ADMIN_PASSWORD:?set TESTSYS_GRAFANA_ADMIN_PASSWORD}
