  <title id="artwork-title">TestSys — wordmark</title>
  <desc id="artwork-description">Standalone TestSys wordmark, extracted from the approved vector logo. Lettering consists entirely of outlined paths and does not require fonts. No emblem is included. Canvas fitted to the visible artwork for interface use; original vector geometry and uniform scaling retained. Brand palette: #243B8F and #FFF0C9.</desc>
