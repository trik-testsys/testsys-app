<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../lib/dev-loader.js"></script>
<style>body{padding:20px;background:var(--surface-page)} .l{font:500 11px var(--font-mono);color:var(--text-tertiary);margin-bottom:8px;display:block} .r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style>
<link rel="icon" type="image/svg+xml" sizes="any" href="../../assets/brand/emblem/svg/TestSys-emblem.svg">
</head><body><div id="root"><div style="padding:40px;text-align:center;font:500 12px var(--font-mono);color:var(--text-tertiary)">Загрузка…</div></div>
<script src="../../lib/catalog-nav.js"></script>
<script type="text/babel" src="../../lib/CatalogExamples.jsx"></script>
<script type="text/babel">
window.__tsReady.then(NS => {
const { StatusBadge, Verdict, Tag, Counter, Avatar, AvatarGroup, ProgressBar, Difficulty, Timer, StatCard, ContestCard, Row, Button } = NS;
function Demo() {
  const [notice, setNotice] = React.useState('Исходные варианты');
  return <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
    <div className="r"><StatusBadge tone="live">Идёт</StatusBadge><StatusBadge tone="info">Регистрация</StatusBadge><StatusBadge tone="warning">Заморожено</StatusBadge><StatusBadge tone="neutral">Завершено</StatusBadge><StatusBadge tone="draft">Черновик</StatusBadge></div>
    <div className="r">{['ok', 'wa', 'tle', 'mle', 're', 'ce', 'queue'].map(v => <Verdict key={v} code={v} />)}<Verdict code="tle" showLabel /></div>
    <div className="r"><Tag>графы</Tag>{notice !== 'Тег удалён' ? <Tag onRemove={() => setNotice('Тег удалён')}>строки</Tag> : <Button onClick={() => setNotice('Исходные варианты')}>Вернуть тег</Button>}<Tag variant="dark">★ 1842</Tag><Tag variant="up">+38</Tag><Tag variant="down">−12</Tag><Counter>3</Counter><Counter tone="dark">24</Counter><Difficulty level={1} /><Difficulty level={2} /><Difficulty level={3} /></div>
    <div className="r"><Avatar name="Анна Смирнова" size={40} /><Avatar name="Илья Петров" /><Avatar initials="T1" square tone="dark" size={40} /><AvatarGroup names={['Анна Смирнова', 'Илья Петров', 'Мария Ким', 'Денис Орлов', 'Олег Н']} /><div style={{ width: 160 }}><ProgressBar value={71} /></div><div style={{ width: 120 }}><ProgressBar indeterminate thin /></div><Timer seconds={5077} /><Timer seconds={462} /></div>
    <Row tight><StatCard span={8} label="Участников" value="1 284" delta="+36 за час" trend="up" /><StatCard span={8} dark label="До окончания" value={<Timer seconds={5077} variant="text" />} /><ContestCard span={8} title="Квиз по алгоритмам" format="Квиз · 40 мин" status="Идёт" statusTone="live" when="01:24:37" people="1 284" cta="Войти" onClick={() => setNotice('Карточка открыта')} onCta={() => setNotice('CTA выполнено')} /></Row>
  </div>;
}
function Card() {
  const [version, setVersion] = React.useState(0);
  return <><NS.Button variant="secondary" size="sm" onClick={() => setVersion(version + 1)}>Сбросить всю карточку</NS.Button><><div onClick={e => { const target = e.target.closest('button, a'); if (target && !target.disabled) { const status = document.getElementById('card-action-status'); status.textContent = 'Действие: ' + (target.textContent.trim() || target.getAttribute('aria-label') || 'выбор'); } }}><Demo key={version} /><p id="card-action-status" role="status">Выберите действие в образцах</p></div><CatalogExamples key={'states-' + version} group="display" namespace={NS} /></></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
});
</script></body></html>
