<!-- @dsCard group="Components" viewport="700x560" name="Forms" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../lib/dev-loader.js"></script>
<style>body{padding:20px;background:var(--surface-page)} .l{font:500 11px var(--font-mono);color:var(--text-tertiary);margin-bottom:8px;display:block} .r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style>
<link rel="icon" type="image/svg+xml" sizes="any" href="../../assets/brand/emblem/svg/TestSys-emblem.svg">
</head><body><div id="root"><div style="padding:40px;text-align:center;font:500 12px var(--font-mono);color:var(--text-tertiary)">Загрузка…</div></div>
<script src="../../lib/catalog-nav.js"></script>
<script type="text/babel" src="../../lib/CatalogExamples.jsx"></script>
<script type="text/babel">
window.__tsReady.then(NS => {
const { Field, Input, Textarea, Select, MultiSelect, Checkbox, Radio, Switch, SegmentedControl, FileDrop, DateRangeCalendar, Icon } = NS;
function Demo() {
  const [notice, setNotice] = React.useState('Исходные варианты');
  const [lang, setLang] = React.useState('visual'); const [topics, setTopics] = React.useState(['statement', 'exercise']);
  const [c, setC] = React.useState(true); const [r, setR] = React.useState('Ученик'); const [sw, setSw] = React.useState(true); const [seg, setSeg] = React.useState('Код');
  const [month, setMonth] = React.useState(8); const [year, setYear] = React.useState(2026);
  const navigateMonth = delta => { const next = new Date(year, month + delta, 1); setYear(next.getFullYear()); setMonth(next.getMonth()); };
  const [range, setRange] = React.useState({ start: '2026-09-10', end: '2026-09-25' });
  return <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, alignItems: 'start' }}>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <Field label="Название" hint="Будет видно участникам"><Input placeholder="Весенний кубок" /></Field>
      <Field label="Почта" error="Введите корректный адрес"><Input error defaultValue="anna@mail" /></Field>
      <Field label="Длительность"><Input prefix={<Icon name="clock" />} suffix="минут" mono defaultValue="300" /></Field>
      <Field label="Вид решения"><Select value={lang} onChange={setLang} options={[{ value: 'visual', label: 'Визуальная программа TRIK Studio' }, { value: 'py', label: 'Python' }, { value: 'js', label: 'JavaScript' }]} /></Field>
      <Field label="Ресурсы"><MultiSelect value={topics} onChange={setTopics} options={[{ value: 'statement', label: 'Условие' }, { value: 'polygon', label: 'Полигон' }, { value: 'exercise', label: 'Упражнение' }, { value: 'solution', label: 'Решение' }]} maxChips={2} /></Field>
      <div className="r" style={{ gap: 18 }}><Checkbox checked={c} onChange={setC} label="Отправлять уведомления" /><Checkbox indeterminate label="Частично" /></div>
      <div className="r" style={{ gap: 18 }}>{['Ученик', 'Организатор'].map(f => <Radio key={f} label={f} checked={r === f} onChange={() => setR(f)} />)}</div>
      <Switch label="Уведомления на почту" checked={sw} onChange={setSw} />
      <SegmentedControl options={['Код', 'Файл']} value={seg} onChange={setSeg} size="sm" />
    </div>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ background: 'var(--white)', border: '1px solid var(--line)', borderRadius: 12, padding: 16 }}><DateRangeCalendar year={year} month={month} onPrev={() => navigateMonth(-1)} onNext={() => navigateMonth(1)} onMonthChange={(year, month) => { setYear(year); setMonth(month); }} start={range.start} end={range.end} today="2026-09-24" onChange={setRange} /></div>
      <FileDrop onSelect={files => setNotice('Выбран файл: ' + files[0].name)} hint=".zip · до 20 МБ" minHeight={110} />
      <FileDrop state="uploading" fileName="solution.qrs" fileType="QRS" fileMeta="2.6 из 4.2 КБ" progress={62} minHeight={90} />
      <Field label="Текст"><Textarea placeholder="Объявление" style={{ minHeight: 64 }} /></Field>
    </div>
  </div>;
}
function Card() {
  const [version, setVersion] = React.useState(0);
  return <><NS.Button variant="secondary" size="sm" onClick={() => setVersion(version + 1)}>Сбросить всю карточку</NS.Button><><div onClick={e => { const target = e.target.closest('button, a'); if (target && !target.disabled) { const status = document.getElementById('card-action-status'); status.textContent = 'Действие: ' + (target.textContent.trim() || target.getAttribute('aria-label') || 'выбор'); } }}><Demo key={version} /><p id="card-action-status" role="status">Выберите действие в образцах</p></div><CatalogExamples key={'states-' + version} group="forms" namespace={NS} /></></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
});
</script></body></html>
