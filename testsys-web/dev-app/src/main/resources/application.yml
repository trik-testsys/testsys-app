server:
  port: 8081
  servlet:
    session:
      cookie:
        name: TESTSYS_DEV_SESSION
spring:
  application:
    name: testsys-web-dev-app
vaadin:
  launch-browser: false
  # Resolve the initial route before sending HTML, preserving the error handler HTTP status.
  eagerServerLoad: true
  # Dev mode writes its files into the build folder; without a token file from the Gradle plugin it defaults to
  # Maven's target/.
  build:
    folder: build
