<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../lib/dev-loader.js"></script>
<style>body{padding:20px;background:var(--surface-page)} .l{font:500 11px var(--font-mono);color:var(--text-tertiary);margin-bottom:8px;display:block} .r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style>
<link rel="icon" type="image/svg+xml" sizes="any" href="../../assets/brand/emblem/svg/TestSys-mono-emblem.svg?v=rounded-96">
</head><body><div id="root"><div style="padding:40px;text-align:center;font:500 12px var(--font-mono);color:var(--text-tertiary)">Загрузка…</div></div>
<script src="../../lib/catalog-nav.js"></script>
<script type="text/babel" src="../../lib/CatalogExamples.jsx"></script>
<script type="text/babel">
window.__tsReady.then(NS => {
const { DataTable, Leaderboard, Block, Verdict, Pagination, SortableList } = NS;
function Demo() {
  const [notice, setNotice] = React.useState('Исходные варианты');
  const [sel, setSel] = React.useState(['48190']);
  const rows = [{ id: '48213', p: 'C. Разрезание', lang: 'C++ 17', v: 'wa', t: '—' }, { id: '48190', p: 'B. Скобки', lang: 'Python', v: 'ok', t: '48 мс' }, { id: '48102', p: 'B. Скобки', lang: 'Python', v: 'tle', t: '1000 мс' }];
  const [probs, setProbs] = React.useState([{ id: 1, n: 'Сумма' }, { id: 2, n: 'Скобки' }, { id: 3, n: 'Разрезание' }, { id: 4, n: 'Треугольники' }]);
  return <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
    <Block title="Порядок задач" subtitle="Перетащите за ⋮⋮">
      <SortableList items={probs} onChange={setProbs} renderItem={(p, i) => <><span className="ts-filetype" style={{ width: 28, height: 28, borderRadius: 6, fontSize: 13 }}>{'ABCD'[i]}</span><b style={{ flex: 1, fontWeight: 600 }}>{p.n}</b><span className="ts-mono ts-muted" style={{ fontSize: 12 }}>1 с · 256 МБ</span></>} />
    </Block>
    <Block title="Посылки" flush footer={<><span className="ts-muted" style={{ flex: 1, fontSize: 13 }}>1–3 из 1 412</span><Pagination page={1} total={57} compact /></>}>
      <DataTable selectable selected={sel} onSelectChange={setSel} rows={rows} columns={[{ key: 'id', title: 'ID', mono: true }, { key: 'p', title: 'Задача' }, { key: 'lang', title: 'Язык', muted: true }, { key: 'v', title: 'Вердикт', render: r => <Verdict code={r.v} /> }, { key: 't', title: 'Время', mono: true, align: 'right' }]} />
    </Block>
    <Block title="Положение" flush>
      <Leaderboard problems={['A', 'B', 'C', 'D']} rows={[{ name: 'Анна Смирнова', org: 'МФТИ', solved: 4, penalty: 301, cells: [{ state: 'first', value: '+', time: '00:09' }, { state: 'ok', value: '+1', time: '00:41' }, { state: 'ok', value: '+', time: '01:12' }, { state: 'ok', value: '+2', time: '02:40' }] }, { name: 'Илья Петров', org: 'ИТМО', solved: 2, penalty: 144, cells: [{ state: 'ok', value: '+', time: '00:12' }, { state: 'first', value: '+', time: '00:24' }, { state: 'fail', value: '−3' }, { state: 'frozen', value: '?1' }] }]} />
    </Block>
  </div>;
}
function Card() {
  const [version, setVersion] = React.useState(0);
  return <><NS.Button variant="secondary" size="sm" onClick={() => setVersion(version + 1)}>Сбросить всю карточку</NS.Button><><div onClick={e => { const target = e.target.closest('button, a'); if (target && !target.disabled) { const status = document.getElementById('card-action-status'); status.textContent = 'Действие: ' + (target.textContent.trim() || target.getAttribute('aria-label') || 'выбор'); } }}><Demo key={version} /><p id="card-action-status" role="status">Выберите действие в образцах</p></div><CatalogExamples key={'states-' + version} group="data" namespace={NS} /></></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
});
</script></body></html>
