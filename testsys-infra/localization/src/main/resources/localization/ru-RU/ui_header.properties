ui_header.sign_in=Войти
ui_header.search=Поиск по разделам
ui_header.search_empty=Ничего не найдено
ui_header.notifications=Уведомления
ui_header.notifications_empty=Нет уведомлений
ui_header.read_all=Прочитать все
ui_header.unread_count=Уведомления: непрочитанных {$count :integer}
ui_header.unread_item={$label} — не прочитано
ui_header.user_menu=Меню пользователя: {$name}
ui_header.arrival_open=Открыть
ui_header.arrival_close=Закрыть уведомление
ui_header.arrival_count=.input {$count :integer} \
    .match $count \
    one  {{Получено {$count} новое уведомление}} \
    few  {{Получено {$count} новых уведомления}} \
    many {{Получено {$count} новых уведомлений}} \
    *    {{Получено {$count} новых уведомлений}}
ui_header.arrival_batch_hint=Откройте список уведомлений, чтобы посмотреть новые сообщения.
