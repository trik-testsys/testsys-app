<!-- @dsCard group="Colors" viewport="700x210" subtitle="Success, warning, danger — solid / bg / text" name="Semantic" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:8px;border:1px solid rgba(22,24,29,.08)}.sw b{font:600 12px var(--font-sans)}.sw span{font:400 11px var(--font-mono);color:var(--text-secondary)}.g{display:grid;gap:12px}.m{font:400 11px var(--font-mono);color:var(--text-tertiary)}</style>
<link rel="icon" type="image/svg+xml" sizes="any" href="../assets/brand/emblem/svg/TestSys-emblem.svg">
</head><body><div class="g" style="grid-template-columns:repeat(3,1fr)"><div class="g" style="grid-template-columns:repeat(3,1fr);gap:6px"><div class="sw"><i style="background:var(--success)"></i><b>Success</b><span>--success</span></div><div class="sw"><i style="background:var(--success-bg)"></i><b>bg</b><span>--success-bg</span></div><div class="sw"><i style="background:var(--success-fg)"></i><b>text</b><span>--success-fg</span></div></div><div class="g" style="grid-template-columns:repeat(3,1fr);gap:6px"><div class="sw"><i style="background:var(--warning)"></i><b>Warning</b><span>--warning</span></div><div class="sw"><i style="background:var(--warning-bg)"></i><b>bg</b><span>--warning-bg</span></div><div class="sw"><i style="background:var(--warning-fg)"></i><b>text</b><span>--warning-fg</span></div></div><div class="g" style="grid-template-columns:repeat(3,1fr);gap:6px"><div class="sw"><i style="background:var(--danger)"></i><b>Danger</b><span>--danger</span></div><div class="sw"><i style="background:var(--danger-bg)"></i><b>bg</b><span>--danger-bg</span></div><div class="sw"><i style="background:var(--danger-fg)"></i><b>text</b><span>--danger-fg</span></div></div></div><p class="m" style="margin:14px 0 0">Info uses --info-bg + accent. Warning is orange so it never reads as the cream selection colour.</p></body></html>
