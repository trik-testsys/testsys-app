<!-- @dsCard group="Components" viewport="700x420" name="Overlays" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../lib/dev-loader.js"></script>
<style>body{padding:20px;background:var(--surface-page)} .l{font:500 11px var(--font-mono);color:var(--text-tertiary);margin-bottom:8px;display:block} .r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style>
<link rel="icon" type="image/svg+xml" sizes="any" href="../../assets/brand/emblem/svg/TestSys-emblem.svg">
</head><body><div id="root"><div style="padding:40px;text-align:center;font:500 12px var(--font-mono);color:var(--text-tertiary)">Загрузка…</div></div>
<script src="../../lib/catalog-nav.js"></script>
<script type="text/babel" src="../../lib/CatalogExamples.jsx"></script>
<script type="text/babel">
window.__tsReady.then(NS => {
const { Dialog, Drawer, Tooltip, Menu, Popover, Button, IconButton, Avatar, Tag } = NS;
function Demo() {
  const [notice, setNotice] = React.useState('Исходные варианты');
  const [dialog, setDialog] = React.useState(true); const [drawer, setDrawer] = React.useState(true);
  return <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
    <div style={{ position: 'relative', height: 250, borderRadius: 12, overflow: 'hidden' }}>
      <Dialog open={dialog} onClose={() => setDialog(false)} contained variant="danger" title="Завершить соревнование?" footer={<><Button variant="secondary" onClick={() => setDialog(false)}>Отмена</Button><Button variant="danger" onClick={() => { setDialog(false); setNotice('Демонстрация завершена'); }}>Завершить</Button></>}>Приём решений остановится. Отменить нельзя.</Dialog>
    </div>
    <div style={{ position: 'relative', height: 250, borderRadius: 12, overflow: 'hidden', background: 'var(--canvas-deep)' }}>
      <Drawer open={drawer} onClose={() => setDrawer(false)} contained width={250} title="Посылка #48213" subtitle="C. Разрезание" footer={<Button size="sm" onClick={() => setNotice('Перепроверено')}>Перепроверить</Button>}><span className="ts-muted">Детали посылки</span></Drawer>
    </div>
    <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start', paddingTop: 36 }}>
      <Tooltip open content="Перепроверить все"><IconButton icon="refresh-cw" label="Перепроверить" variant="secondary" /></Tooltip>
      <Tooltip static placement="right" content="Время + 20 мин за каждую неверную попытку" />
    </div>
    <div style={{ display: 'flex', gap: 12, justifyContent: 'flex-end', height: 190 }}>
      <Menu onSelect={setNotice} defaultOpen items={[{ label: 'Открыть посылку', kbd: '↵' }, { label: 'Перепроверить', kbd: 'R' }, { label: 'Скачать код', kbd: 'D' }, { separator: true }, { label: 'Дисквалифицировать', danger: true }]} />
    </div>
  </div>;
}
function Card() {
  const [version, setVersion] = React.useState(0);
  return <><NS.Button variant="secondary" size="sm" onClick={() => setVersion(version + 1)}>Сбросить всю карточку</NS.Button><><div onClick={e => { const target = e.target.closest('button, a'); if (target && !target.disabled) { const status = document.getElementById('card-action-status'); status.textContent = 'Действие: ' + (target.textContent.trim() || target.getAttribute('aria-label') || 'выбор'); } }}><Demo key={version} /><p id="card-action-status" role="status">Выберите действие в образцах</p></div><CatalogExamples key={'states-' + version} group="overlays" namespace={NS} /></></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
});
</script></body></html>
