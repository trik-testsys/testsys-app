# Application parameters of the dev environment, mounted by deploy/compose.dev.yml as application-environment.yml.
# The Mailpit address, the service interface code and the Grafana address are set in deploy/compose.dev.yml,
# the grading node addresses in TESTSYS_GRADING_NODES. The email confirmation parameters, the invite TTLs and
# the participant limit are initial values: values saved in the service cabinet override them.
testsys:
  operation:
    community:
      public-community-id: 1
      public-community-name: Публичное Сообщество
    # Supervisor of the environment; its access code is fixed and not secret.
    supervisor:
      name: Супервайзер
      access-token: Supe-rvis-or00-0001
    email-confirmation:
      confirmation-code-lifetime: PT15M
      max-confirmation-attempts: 3
    community-invite:
      ttl: P7D
      refresh-period: PT1H
    competition:
      max-participants: 500
    class-invite:
      ttl: P7D
      refresh-period: PT1H
