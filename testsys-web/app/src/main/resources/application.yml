server:
  port: 8080
  servlet:
    session:
      cookie:
        name: TESTSYS_APP_SESSION
spring:
  boot:
    # Keep auto-configuration limited to explicit imports in each context.
    enableautoconfiguration: false
  application:
    name: testsys-web-app
logging:
  pattern:
    # Every line shows the signed-in user id and the open page of the main interface request, or `-` outside it.
    correlation: "[%X{user:--} %X{route:--}] "
management:
  prometheus:
    metrics:
      export:
        properties:
          "[io.prometheus.exporter.include_created_timestamps]": "true"
vaadin:
  launch-browser: false
  # Resolve the initial route before sending HTML, preserving the error handler HTTP status.
  eagerServerLoad: true
  # Dev mode writes its files into the build folder; without a token file from the Gradle plugin it defaults to
  # Maven's target/.
  build:
    folder: build
testsys:
  service:
    address: 127.0.0.1
    port: 8081
    secret: ${TESTSYS_SERVICE_SECRET}
    # The required Grafana address testsys.service.grafana-url has no default and is passed at launch.
  metrics:
    # The metrics server listens on all interfaces; the deployment keeps the port in an internal network.
    port: 8082
  web:
    localization:
      # Region of the users whose region cookie and browser languages are not supported, a SupportedRegion name.
      default-region: RU
      # Zone of the dates until the browser reports its own.
      default-time-zone: Europe/Moscow
