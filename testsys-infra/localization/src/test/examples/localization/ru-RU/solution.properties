solution.status=.input {$status :string} \
    .match $status \
    accepted {{Решение принято}} \
    rejected {{Решение отклонено}} \
    *        {{Решение проверяется}}
solution.sent=Решение отправлено в {$sentAt :time precision=second hour12=false}
solution.duration=Время выполнения: {$seconds :number maximumSignificantDigits=3} с
solution.memory=Использовано памяти: {$memory :unit unit=megabyte minimumFractionDigits=1}
solution.limit=Ограничение ресурса: {$value :unit unit=$unit}
