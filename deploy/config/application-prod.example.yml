# Template of the production application parameters. Copy it to the server outside the Git checkout, replace
# every <...> placeholder and pass the absolute path of the copy in TESTSYS_APP_CONFIG; deploy/compose.prod.yml
# mounts it as application-environment.yml. The file must be readable by UID 10001 of the application container.
# The secrets, the Grafana address and the grading node addresses are variables of the production variable file
# (template: deploy/env/prod.env.example), not part of this file. The email confirmation parameters, the invite TTLs
# and the participant limit are initial values: values saved in the service cabinet override them.
server:
  # The HTTPS proxy in front of the main interface passes the client address and scheme in forwarded headers.
  # Applies only to the main interface: the service interface and the metrics server set none.
  forward-headers-strategy: native
testsys:
  operation:
    community:
      # ID of the existing Public Community, or the ID to create in an empty database.
      public-community-id: <id>
      public-community-name: <name>
    supervisor:
      # The Supervisor access code is TESTSYS_SUPERVISOR_ACCESS_TOKEN of the production variable file.
      name: <name>
    email-confirmation:
      confirmation-code-lifetime: <ISO-8601 duration, for example PT15M>
      max-confirmation-attempts: <number>
    community-invite:
      ttl: <ISO-8601 duration>
      refresh-period: <ISO-8601 duration>
    competition:
      max-participants: <number>
    class-invite:
      ttl: <ISO-8601 duration>
      refresh-period: <ISO-8601 duration>
  # Every value is required: the module defaults are suitable only for a local SMTP server without authorization.
  # With smtp-auth true, username and the password TESTSYS_MAIL_PASSWORD must not be empty.
  mail:
    host: <SMTP host>
    port: <SMTP port>
    username: <SMTP username>
    from: <sender address>
    smtp-auth: <true or false>
    ssl: <true or false>
    starttls: <true or false>
