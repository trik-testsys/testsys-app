page_judge.solution.status=.input {$status :string} \
    .match $status \
    queued        {{В очереди}} \
    in_progress   {{Проверяется}} \
    success       {{Проверена}} \
    grading_error {{Ошибка проверки}} \
    timeout       {{Превышено время проверки}} \
    *             {{Неизвестный статус}}
page_judge.solution.language=.input {$language :string} \
    .match $language \
    python          {{Python}} \
    javascript      {{JavaScript}} \
    visual_language {{Визуальный язык}} \
    *               {{Неизвестный язык}}
