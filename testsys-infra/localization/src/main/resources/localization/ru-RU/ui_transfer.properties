ui_transfer.upload_limits=.input {$count :integer} \
    .input {$size :number maximumFractionDigits=1} \
    .input {$unit :string} \
    .match $count $unit \
    one  byte     {{До {$count} файла, до {$size} Б каждый}} \
    one  kilobyte {{До {$count} файла, до {$size} КБ каждый}} \
    one  megabyte {{До {$count} файла, до {$size} МБ каждый}} \
    one  gigabyte {{До {$count} файла, до {$size} ГБ каждый}} \
    few  byte     {{До {$count} файлов, до {$size} Б каждый}} \
    few  kilobyte {{До {$count} файлов, до {$size} КБ каждый}} \
    few  megabyte {{До {$count} файлов, до {$size} МБ каждый}} \
    few  gigabyte {{До {$count} файлов, до {$size} ГБ каждый}} \
    many byte     {{До {$count} файлов, до {$size} Б каждый}} \
    many kilobyte {{До {$count} файлов, до {$size} КБ каждый}} \
    many megabyte {{До {$count} файлов, до {$size} МБ каждый}} \
    many gigabyte {{До {$count} файлов, до {$size} ГБ каждый}} \
    one  *        {{До {$count} файла, до {$size} Б каждый}} \
    few  *        {{До {$count} файлов, до {$size} Б каждый}} \
    many *        {{До {$count} файлов, до {$size} Б каждый}} \
    *    *        {{До {$count} файлов, до {$size} Б каждый}}
ui_transfer.download_label={$label}: {$state}
ui_transfer.percent={$value :integer}%
ui_transfer.transferred_bytes=Передано: {$count :number} Б
