name: Lint

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    outputs:
      modules: ${{ steps.sarif.outputs.modules }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      # autoCorrect is off: rewriting sources during the analysis hides a part of the findings and shifts their
      # positions away from the commit. `--continue` analyses every module instead of stopping at the first failure.
      # The common entry point includes every source set, including tests and codegen.
      - name: Run Detekt
        run: >-
          ./gradlew detekt -Pdetekt.autoCorrect=false --continue --no-daemon

      - name: Upload Detekt report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: detekt-report
          path: |
            **/build/reports/detekt/
          retention-days: 7

      # Preserve a category per module/task and separate module directories to keep uploads below the run limit.
      - name: Collect SARIF reports
        id: sarif
        if: always()
        run: |
          mkdir -p build/sarif
          modules=()
          while IFS= read -r f; do
            f="${f#./}"
            module="${f%%/build/reports/detekt/*}"
            # Flatten module paths so a parent module upload cannot include its child modules.
            directory="${module//\//_}"
            mkdir -p "build/sarif/$directory"
            category="detekt/${module}/$(basename "$f" .sarif)"
            jq --arg category "$category" '.runs[].automationDetails.id = $category' "$f" \
              > "build/sarif/$directory/$(basename "$f")"
            modules+=("$module")
          done < <(find . -path "*/build/reports/detekt/*.sarif" -type f)
          matrix=$(jq -cn --args '$ARGS.positional | unique | map({module: ., directory: gsub("/"; "_")})' "${modules[@]}")
          echo "modules=$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload prepared SARIF reports
        uses: actions/upload-artifact@v7
        if: always() && steps.sarif.outputs.modules != '' && steps.sarif.outputs.modules != '[]'
        with:
          name: detekt-sarif
          path: build/sarif/
          retention-days: 7

      - name: Publish Detekt summary
        if: always()
        run: |
          shopt -s nullglob
          reports=(build/sarif/*/*.sarif)
          {
            echo "## Detekt"
            echo
            if [ ${#reports[@]} -eq 0 ]; then
              echo "No Detekt reports were produced: the build failed before the analysis."
            else
              total=$(jq -s '[.[].runs[].results[]] | length' "${reports[@]}")
              if [ "$total" -eq 0 ]; then
                echo "✅ No findings."
              else
                echo "❌ Findings: **${total}**"
                echo
                echo "| Rule | Location | Message |"
                echo "|------|----------|---------|"
                jq -rs --arg root "file://${GITHUB_WORKSPACE}/" '
                  .[].runs[].results[]
                  | .locations[0].physicalLocation as $l
                  | "| `\(.ruleId | ltrimstr("detekt."))` "
                    + "| `\($l.artifactLocation.uri | ltrimstr($root)):\($l.region.startLine)` "
                    + "| \(.message.text | gsub("\\|"; "\\|") | gsub("\n"; " ")) |"
                ' "${reports[@]}"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  upload-sarif:
    name: SARIF (${{ matrix.module }})
    needs: detekt
    if: always() && needs.detekt.outputs.modules != '' && needs.detekt.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      # Required for code scanning uploads; private repositories also need `actions: read`.
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detekt.outputs.modules) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download prepared SARIF reports
        uses: actions/download-artifact@v8
        with:
          name: detekt-sarif
          path: build/sarif

      - name: Upload module SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('build/sarif/{0}/*.sarif', matrix.directory)) != ''
        with:
          sarif_file: build/sarif/${{ matrix.directory }}
