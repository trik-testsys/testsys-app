competition.place=.input {$place :integer select=ordinal} \
    .match $place \
    other {{Вы заняли {$place :ordinal rules=digits-ordinal-neuter} место}} \
    *     {{Вы заняли {$place :ordinal rules=digits-ordinal-neuter} место}}
competition.participants=.input {$count :integer} \
    .local $others = {$count :offset subtract=1} \
    .match $others \
    0    {{Только вы}} \
    one  {{Вы и ещё {$others} участник}} \
    few  {{Вы и ещё {$others} участника}} \
    many {{Вы и ещё {$others} участников}} \
    *    {{Вы и ещё {$others} участника}}
competition.rivals=.input {$count :integer} \
    .local $others = {$count :offset subtract=1} \
    {{Кроме вас: {$others} {$others :term name=user case=nom}}}
competition.season=Сезон {$year :integer useGrouping=never}
competition.period=Период проведения: {$month :date icu:skeleton=yMMMM}
competition.fee=Взнос за участие: {$fee :currency currency=RUB}
competition.fee.foreign=Взнос за участие: {$fee :currency currency=$currency}
competition.prize=Призовой фонд: {$prize :currency}
