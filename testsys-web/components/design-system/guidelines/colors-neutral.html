<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:8px;border:1px solid rgba(22,24,29,.08)}.sw b{font:600 12px var(--font-sans)}.sw span{font:400 11px var(--font-mono);color:var(--text-secondary)}.g{display:grid;gap:12px}.m{font:400 11px var(--font-mono);color:var(--text-tertiary)}</style>
<link rel="icon" type="image/svg+xml" sizes="any" href="../assets/brand/emblem/svg/TestSys-emblem.svg">
</head><body><div class="g" style="grid-template-columns:repeat(7,1fr)"><div class="sw"><i style="background:var(--canvas)"></i><b>Canvas</b><span>--canvas</span></div><div class="sw"><i style="background:var(--white)"></i><b>White</b><span>--white</span></div><div class="sw"><i style="background:var(--sunken)"></i><b>Sunken</b><span>--sunken</span></div><div class="sw"><i style="background:var(--muted)"></i><b>Muted</b><span>--muted</span></div><div class="sw"><i style="background:var(--canvas-deep)"></i><b>Canvas deep</b><span>--canvas-deep</span></div><div class="sw"><i style="background:var(--line)"></i><b>Line</b><span>--line</span></div><div class="sw"><i style="background:var(--line-strong)"></i><b>Line strong</b><span>--line-strong</span></div></div></body></html>
