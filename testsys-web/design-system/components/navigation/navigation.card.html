<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../lib/dev-loader.js"></script>
<style>body{padding:20px;background:var(--surface-page)} .l{font:500 11px var(--font-mono);color:var(--text-tertiary);margin-bottom:8px;display:block} .r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style>
</head><body><div id="root"><div style="padding:40px;text-align:center;font:500 12px var(--font-mono);color:var(--text-tertiary)">Загрузка…</div></div>
<script type="text/babel">
window.__tsReady.then(NS => {
const { Header, Tabs, PillTabs, Breadcrumbs, Pagination, FilterChip, Stepper } = NS;
function Demo() {
  const [tab, setTab] = React.useState('tasks'); const [pill, setPill] = React.useState('Все'); const [page, setPage] = React.useState(3);
  const [f, setF] = React.useState({ Все: true }); const [step, setStep] = React.useState(1);
  return <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
    <div style={{ border: '1px solid var(--line)', borderRadius: 12, overflow: 'hidden', margin: '0 -20px 0 0', width: 'calc(100% + 20px)' }}><div style={{ width: 1100, transform: 'scale(0.6)', transformOrigin: 'top left', height: 38 }}><Header active="contests" user={{ name: 'Анна Смирнова', short: 'Анна С.' }} notifications /></div></div>
    <Tabs value={tab} onChange={setTab} items={[{ value: 'overview', label: 'Обзор' }, { value: 'tasks', label: 'Задачи', count: 8 }, { value: 'std', label: 'Положение' }, { value: 'q', label: 'Вопросы', count: 3, countTone: 'danger' }]} />
    <div className="r" style={{ justifyContent: 'space-between' }}><PillTabs items={['Все', 'Олимпиады', 'Контесты', 'Квизы']} value={pill} onChange={setPill} /><Breadcrumbs items={[{ label: 'Соревнования' }, { label: 'Весенний кубок' }, { label: 'Задача C' }]} /></div>
    <div className="r" style={{ justifyContent: 'space-between' }}><div className="r" style={{ gap: 8 }}>{['Все', 'Идут', 'Регистрация', 'Мои'].map(k => <FilterChip key={k} selected={!!f[k]} onChange={v => setF({ ...f, [k]: v })}>{k}</FilterChip>)}<FilterChip dropdown>Язык: все</FilterChip></div><Pagination page={page} total={24} onChange={setPage} /></div>
    <Stepper current={step} onStepClick={setStep} steps={[{ label: 'Основное', sub: 'Название' }, { label: 'Формат', sub: 'ICPC' }, { label: 'Задачи', sub: '4 задачи' }, { label: 'Публикация' }]} />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
