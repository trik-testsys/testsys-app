### --- Hibernate defaults --- ###

# Store Instant as TIMESTAMP WITH TIME ZONE (UTC)
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=2014

# Batch inserts/updates for better performance
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Pad IN clause parameters to powers of 2 for better query plan caching
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Consistent UTC timezone for JDBC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Turn off Open Session in View
spring.jpa.open-in-view=false
