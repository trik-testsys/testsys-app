# The service interface listens on the loopback interface; the deployment sets another address.
testsys.service.address=127.0.0.1
testsys.service.port=8081
# The metrics server listens on all interfaces; the deployment keeps the port in an internal network.
testsys.metrics.address=0.0.0.0
testsys.metrics.port=8082
# Region of the users whose region cookie and browser languages are not supported, a SupportedRegion name.
testsys.web.localization.default-region=RU
# Zone of the dates until the browser reports its own.
testsys.web.localization.default-time-zone=Europe/Moscow
# Requests of one client address to the main interface within one window of a whole number of seconds; the next
# ones get 429. false in enforce only logs the clients over the limit.
testsys.web.rate-limit.requests=1200
testsys.web.rate-limit.duration=PT1M
testsys.web.rate-limit.enforce=true
# Failed sign-ins to the main interface per e-mail address or, by access code, per client address; the failure
# that reaches the number within the duration of a whole number of seconds closes signing in for the same duration.
testsys.web.sign-in-limit.failures=5
testsys.web.sign-in-limit.duration=PT5M
