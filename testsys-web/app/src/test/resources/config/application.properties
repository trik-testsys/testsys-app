testsys.file-storage.paths.statement=${user.dir}/build/test-file-storage/statement
testsys.file-storage.paths.exercise=${user.dir}/build/test-file-storage/exercise
testsys.file-storage.paths.test=${user.dir}/build/test-file-storage/test
testsys.file-storage.paths.solution=${user.dir}/build/test-file-storage/solution
testsys.file-storage.paths.recording=${user.dir}/build/test-file-storage/recording
testsys.file-storage.paths.logs=${user.dir}/build/test-file-storage/logs
# Required operation settings; tests replace the public community with a fixture community.
testsys.operation.community.public-community-id=1
testsys.operation.community.public-community-name=Public test community
testsys.operation.email-confirmation.confirmation-code-lifetime=PT15M
testsys.operation.email-confirmation.max-confirmation-attempts=3
testsys.operation.community-invite.ttl=P7D
testsys.operation.community-invite.refresh-period=PT1H
testsys.operation.competition.max-participants=500
testsys.operation.class-invite.ttl=P7D
testsys.operation.class-invite.refresh-period=PT1H
testsys.operation.supervisor.name=Test supervisor
testsys.operation.supervisor.access-token=Supe-rvis-or00-0001
# Fixed non-secret key of access-code hashing for the tests.
testsys.access-token.secret=app-test-access-token-secret-of-at-least-sixty-four-characters-long
# Runtime tests pass the other service settings as arguments; the Grafana address is only opened by the service home button.
testsys.service.grafana-url=http://127.0.0.1:3000/
# The metrics server of runtime tests takes a free port.
testsys.metrics.port=0
