# Loki of a TestSys environment stores the logs that Alloy of the same Compose project sends; see the section
# "Мониторинг" in deploy/README.md. deploy/compose.monitoring.yml mounts this file. A single process runs all Loki
# components and keeps its data in the loki-data volume mounted at /loki.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # The same period as the metrics of Prometheus.
  retention_period: 14d

compactor:
  working_directory: /loki/compactor
  # The compactor deletes logs older than retention_period.
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
