name: Build

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]
  workflow_call:
    inputs:
      ref:
        description: Commit to check instead of the triggering one
        type: string
        default: ''

concurrency:
  # A literal prefix: in a called workflow `github.workflow` is the caller's name.
  group: build-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      # Turns Kotlin compiler errors and warnings into annotations on the changed files.
      - name: Register Kotlin problem matcher
        run: echo "::add-matcher::.github/kotlin-problem-matcher.json"

      - name: Build
        run: ./gradlew assemble --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            **/build/libs/*.jar
            !buildSrc/**
          if-no-files-found: error
          retention-days: 14
