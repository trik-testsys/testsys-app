<!-- @dsCard group="Components" viewport="700x300" name="Actions" -->
<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../lib/dev-loader.js"></script>
<style>body{padding:20px;background:var(--surface-page)} .l{font:500 11px var(--font-mono);color:var(--text-tertiary);margin-bottom:8px;display:block} .r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style>
<link rel="icon" type="image/svg+xml" sizes="any" href="../../assets/brand/emblem/svg/TestSys-mono-emblem.svg?v=rounded-96">
</head><body><div id="root"><div style="padding:40px;text-align:center;font:500 12px var(--font-mono);color:var(--text-tertiary)">Загрузка…</div></div>
<script src="../../lib/catalog-nav.js"></script>
<script type="text/babel" src="../../lib/CatalogExamples.jsx"></script>
<script type="text/babel">
window.__tsReady.then(NS => {
const { Button, IconButton, DownloadButton } = NS;
function Demo() {
  const [notice, setNotice] = React.useState('Исходные варианты');
  const [st, setSt] = React.useState('idle'); const [p, setP] = React.useState(0);
  const pending = React.useRef([]);
  React.useEffect(() => () => pending.current.forEach(clearTimeout), []);
  const cancel = () => { pending.current.forEach(clearTimeout); pending.current = []; setSt('idle'); setP(0); };
  const start = () => { cancel(); setSt('preparing'); pending.current.push(setTimeout(() => { setSt('downloading'); setP(50); }, 500)); pending.current.push(setTimeout(() => { setP(100); setSt('done'); const url = URL.createObjectURL(new Blob(['TestSys demo'])); const a = document.createElement('a'); a.href = url; a.download = 'demo.txt'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); }, 1000)); };
  return <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
    <div><span className="l">Variants</span><div className="r"><Button icon="plus">Создать</Button><Button variant="secondary" icon="list-filter">Фильтры</Button><Button variant="ghost">Подробнее</Button><Button variant="link">Ссылка</Button><Button variant="danger">Удалить</Button><Button variant="danger-soft">Исключить</Button></div></div>
    <div><span className="l">Sizes · states</span><div className="r"><Button size="lg">Отправить решение</Button><Button size="sm">Участвовать</Button><Button loading>Отправка…</Button><Button disabled>Недоступно</Button><IconButton icon="ellipsis" label="Действия" /><IconButton icon="plus" label="Добавить" variant="secondary" /><IconButton icon="x" label="Закрыть" variant="dark" /></div></div>
    <div><span className="l">DownloadButton · click the first one</span><div className="r"><DownloadButton state={st} progress={p} onClick={start} onCancel={cancel} /><DownloadButton state="preparing" /><DownloadButton state="downloading" progress={62} /><DownloadButton state="done" /><DownloadButton state="error" /><DownloadButton iconOnly state="downloading" progress={48} /></div></div>
  </div>;
}
function Card() {
  const [version, setVersion] = React.useState(0);
  return <><NS.Button variant="secondary" size="sm" onClick={() => setVersion(version + 1)}>Сбросить всю карточку</NS.Button><><div onClick={e => { const target = e.target.closest('button, a'); if (target && !target.disabled) { const status = document.getElementById('card-action-status'); status.textContent = 'Действие: ' + (target.textContent.trim() || target.getAttribute('aria-label') || 'выбор'); } }}><Demo key={version} /><p id="card-action-status" role="status">Выберите действие в образцах</p></div><CatalogExamples key={'states-' + version} group="actions" namespace={NS} /></></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
});
</script></body></html>
