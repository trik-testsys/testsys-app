# Tests run on an in-memory H2 in PostgreSQL-compatibility mode and keep files under the build directory.
# Every Spring context of the tests gets its own database, so Liquibase migrates each one from scratch.
spring.datasource.url=jdbc:h2:mem:testsys_app_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
testsys.file-storage.paths.statement=${user.dir}/build/test-file-storage/statement
testsys.file-storage.paths.exercise=${user.dir}/build/test-file-storage/exercise
testsys.file-storage.paths.test=${user.dir}/build/test-file-storage/test
testsys.file-storage.paths.solution=${user.dir}/build/test-file-storage/solution
testsys.file-storage.paths.recording=${user.dir}/build/test-file-storage/recording
testsys.file-storage.paths.logs=${user.dir}/build/test-file-storage/logs
